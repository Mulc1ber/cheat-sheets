# ==========================================
# BACKEND
# ==========================================

backend:
  name: github
  repo: Mulc1ber/cheat-sheets
  branch: main
  auth_methods:
    - token

# ==========================================
# PUBLISH WORKFLOW
# ==========================================
# publish_mode: editorial_workflow

# ==========================================
# MEDIA STORAGE
# ==========================================

media_folder: static/img
public_folder: /img

media_libraries:
  all:
    max_file_size: 5242880

  default:
    config:
      slugify_filename: true

# ==========================================
# COLLECTIONS
# ==========================================

collections:
  # ----------------------------------------
  # DOCUMENTATION
  # ----------------------------------------

  - name: docs
    label: Documentation
    label_singular: Document
    description: Documentation pages
    folder: docs
    # CMS manages only .md files
    extension: md
    create: true

    # Hierarchical folder structure
    nested:
      subfolders: false

    # Allow editors to select document path
    meta:
      path: {}

    # Изображения конкретного документа
    media_folder: /docs/{{dirname}}/img/{{filename}}
    public_folder: ./img/{{filename}}

    fields:
      - name: title
        label: Title
        widget: string

      - name: sidebar_label
        label: Sidebar Label
        widget: string
        required: false

      - name: sidebar_position
        label: Sidebar Position
        widget: number
        required: false

      - name: description
        label: Description
        widget: text
        required: false

      - name: body
        label: Content
        widget: markdown

# ==========================================
# OUTPUT
# ==========================================

output:
  omit_empty_optional_fields: true
